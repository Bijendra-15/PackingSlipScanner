name: Build Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (React)
        run: npm ci
        working-directory: App/frontend

      - name: Build React app
        run: npm run build
        working-directory: App/frontend

      - name: Copy built files to Android assets
        run: |
          mkdir -p App/android/app/src/main/assets
          rm -rf App/android/app/src/main/assets/*
          cp -r App/frontend/dist/* App/android/app/src/main/assets/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: 'true'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: 'false'

      - name: Build APK
        run: gradle assembleDebug
        working-directory: App/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: packing-slip-scanner-apk
          path: App/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: App/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}