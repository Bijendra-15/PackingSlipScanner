name: Build Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (React)
        run: npm ci
        working-directory: App/frontend

      - name: Build React app
        run: npm run build
        working-directory: App/frontend

      - name: Copy built files to Android assets
        run: |
          mkdir -p App/android/app/src/main/assets
          rm -rf App/android/app/src/main/assets/*
          cp -r App/frontend/dist/* App/android/app/src/main/assets/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x App/android/gradlew

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: App/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: packing-slip-scanner-apk
          path: App/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: App/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}