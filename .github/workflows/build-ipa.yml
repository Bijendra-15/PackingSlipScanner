name: Build iOS IPA

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (App)
        run: |
          cd App
          npm install

      - name: Build web app
        run: |
          cd App
          npm run build

      - name: Sync Capacitor iOS
        run: |
          cd App
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd App/ios
          pod install

      - name: Build and Archive iOS
        run: |
          cd App/ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release archive -archivePath $RUNNER_TEMP/App.xcarchive

      - name: Export IPA
        run: |
          cd App/ios
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist exportOptions.plist -exportPath $RUNNER_TEMP

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: $RUNNER_TEMP/App.ipa

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: $RUNNER_TEMP/App.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}