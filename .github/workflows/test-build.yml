name: Test Build

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (App)
        run: |
          cd App
          npm install

      - name: Build web app
        run: |
          cd App
          npm run build

      - name: Lint
        run: |
          cd App
          npm run lint || true

      - name: Typecheck
        run: |
          cd App
          npm run typecheck || true