# Project-wide Gradle settings.
## For more details on how to configure your project's Gradle configuration see
## https://gradle.org/docs/8.1/userguide/build_environment.html
##
## For using Agp versioning, please follow the instructions at
## https://developer.android.com/build/publish/versioning
##
## Plugins to add to your project
plugins {
    id 'com.android.application' version '8.1.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
}

## Top-level build options.
rootProject {
    ext {
        agpVersion = '8.1.2'
        kotlinVersion = '1.9.20'
    }
}